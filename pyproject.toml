[project]
name = "avalanche-llm"
version = "0.1.0"
description = "Small fine-tuned model vs. frontier LLM on Swiss avalanche bulletins."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.9",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avalanche_llm"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
